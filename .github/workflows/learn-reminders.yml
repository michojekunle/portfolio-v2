name: Daily page reminders (French & Spanish)

# Hourly: the job sends each learner's reminder at their own local hour,
# only if today's page isn't done, at most once a day.
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  send-reminders:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - name: Run the reminder job
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.LEARN_CRON_SECRET || secrets.FRENCH_CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "SITE_URL and LEARN_CRON_SECRET (or FRENCH_CRON_SECRET) must be set"; exit 1
          fi
          # A trailing slash or http:// in SITE_URL makes the host answer 308 "Redirecting..."; normalise it.
          # Redirects are then followed only on the same host (curl drops the secret if the host changes).
          SITE_URL="${SITE_URL%/}"
          SITE_URL="https://${SITE_URL#*://}"
          status=$(curl -sL --max-time 240 -o response.json -w "%{http_code}" -X POST "$SITE_URL/api/learn/reminders" \
            -H "Authorization: Bearer $CRON_SECRET" -H "Content-Type: application/json")
          cat response.json; echo
          if [ "$status" -ne 200 ]; then
            echo "Reminder job failed with $status"
            [ "$status" -eq 401 ] && echo "401: CRON_SECRET here doesn't match LEARN_CRON_SECRET / FRENCH_CRON_SECRET in Vercel (or SITE_URL points at a different host than the secret was set on)."
            exit 1
          fi
